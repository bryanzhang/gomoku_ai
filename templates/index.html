<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gomoku vs AI</title>
    <style>
        canvas {
            border: 1px solid #000;
        }
        #config-panel {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            max-width: 600px;
            line-height: 2.2;
        }
        #config-panel input[type=number] { width: 80px; }
        #config-panel input[type=text] { width: 260px; }
        #config-panel .item { margin-right: 14px; }
    </style>
</head>
<body>
    <h1>Gomoku vs AI</h1>

    <div id="config-panel">
        <div>
            <span class="item">AI:
                <select id="ai_type">
                    <option value="model">Policy-Value Network</option>
                    <option value="pure">Pure MCTS</option>
                </select>
            </span>
            <span class="item">Model: <input type="text" id="model" placeholder="defaults to the command-line model"></span>
            <span class="item">Play as:
                <select id="human_color">
                    <option value="1">Black (first)</option>
                    <option value="-1">White</option>
                </select>
            </span>
        </div>
        <div>
            <span class="item">Simulations: <input type="number" id="simulate_times" min="1"></span>
            <span class="item">c_puct: <input type="number" id="c_puct" step="0.1" min="0.01"></span>
            <span class="item">Threads: <input type="number" id="cores" min="1"></span>
            <span class="item"><label><input type="checkbox" id="reuse_states" checked>Reuse search tree</label></span>
            <span class="item"><button id="new_game">New Game</button></span>
        </div>
    </div>

    <canvas id="chessboard" width="600" height="600"></canvas>
    <p id="message"></p>

    <script>
        const canvas = document.getElementById('chessboard');
        const ctx = canvas.getContext('2d');
        const message = document.getElementById('message');
        const newGameBtn = document.getElementById('new_game');
        const aiTypeSel = document.getElementById('ai_type');
        const modelInput = document.getElementById('model');

        let boardSize = 11; // board edge length, pushed by /config after page load (11 or 15)
        let cellSize = canvas.width / boardSize;

        let board = []; // frontend board state: 1=black, -1=white, 0=empty
        let gameOver = false;
        let humanColor = 1;   // 1 = human plays black, -1 = human plays white
        let aiColor = -1;

        // Initialize the board
        function initBoard() {
            board = [];
            for (let i = 0; i < boardSize; i++) {
                board[i] = [];
                for (let j = 0; j < boardSize; j++) {
                    board[i][j] = 0;
                }
            }
            gameOver = false;
            message.textContent = '';
            drawBoard();
        }

        // Draw the board
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(cellSize / 2, cellSize / 2 + i * cellSize);
                ctx.lineTo(canvas.width - cellSize / 2, cellSize / 2 + i * cellSize);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(cellSize / 2 + i * cellSize, cellSize / 2);
                ctx.lineTo(cellSize / 2 + i * cellSize, canvas.height - cellSize / 2);
                ctx.stroke();
            }
            for (let x = 0; x < boardSize; x++) {
                for (let y = 0; y < boardSize; y++) {
                    if (board[x][y] === 1) {
                        drawPiece(x, y, true);
                    } else if (board[x][y] === -1) {
                        drawPiece(x, y, false);
                    }
                }
            }
        }

        // Draw a stone (isBlack: true for black, false for white)
        function drawPiece(x, y, isBlack) {
            ctx.beginPath();
            ctx.arc(
                cellSize / 2 + x * cellSize,
                cellSize / 2 + y * cellSize,
                cellSize / 2 - 4,
                0,
                2 * Math.PI
            );
            ctx.closePath();
            const gradient = ctx.createRadialGradient(
                cellSize / 2 + x * cellSize + 2,
                cellSize / 2 + y * cellSize - 2,
                cellSize / 2 - 4,
                cellSize / 2 + x * cellSize,
                cellSize / 2 + y * cellSize,
                0
            );
            if (isBlack) {
                gradient.addColorStop(0, '#0A0A0A');
                gradient.addColorStop(1, '#636766');
            } else {
                gradient.addColorStop(0, '#D1D1D1');
                gradient.addColorStop(1, '#F9F9F9');
            }
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Play the AI's move on the board
        function placeAiMove(ai_move) {
            const [ai_x, ai_y] = ai_move;
            board[ai_x][ai_y] = aiColor;
            drawBoard();
        }

        // Handle mouse click events
        canvas.onclick = function(e) {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / cellSize);
            const y = Math.floor((e.clientY - rect.top) / cellSize);

            if (board[x][y] !== 0) return;

            // The human plays a move
            board[x][y] = humanColor;
            drawBoard();

            fetch('/handle_state', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({'board' : board, 'x' : x, 'y' : y})
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'win') {
                    message.textContent = 'You win!';
                    gameOver = true;
                } else if (data.result === 'lose') {
                    placeAiMove(data.ai_move);
                    message.textContent = 'AI wins!';
                    gameOver = true;
                } else if (data.result === 'continue') {
                    placeAiMove(data.ai_move);
                    if (data.status === 'draw') {
                        message.textContent = 'Draw!';
                        gameOver = true;
                    }
                } else if (data.result === 'draw') {
                    message.textContent = 'Draw!';
                    gameOver = true;
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        };

        // Enable/disable the model input when the AI type changes
        function syncModelInput() {
            modelInput.disabled = (aiTypeSel.value !== 'model');
        }
        aiTypeSel.onchange = syncModelInput;

        // New game: send the current config; when the human plays white, the
        // server returns the AI's first move.
        newGameBtn.onclick = function() {
            const cfg = {
                ai_type: aiTypeSel.value,
                model: modelInput.value,
                simulate_times: parseInt(document.getElementById('simulate_times').value),
                c_puct: parseFloat(document.getElementById('c_puct').value),
                cores: parseInt(document.getElementById('cores').value),
                reuse_states: document.getElementById('reuse_states').checked,
                human_color: parseInt(document.getElementById('human_color').value)
            };
            message.textContent = 'AI is thinking about the opening move...';
            fetch('/new_game', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(cfg)
            })
            .then(response => response.json())
            .then(data => {
                if (data.result !== 'ok') {
                    message.textContent = 'Failed to start a new game: ' + (data.message || 'unknown error');
                    return;
                }
                humanColor = cfg.human_color;
                aiColor = -humanColor;
                initBoard();
                if (data.ai_move) {
                    placeAiMove(data.ai_move);
                    message.textContent = 'AI has moved, your turn';
                }
            })
            .catch(error => {
                message.textContent = 'New game request failed';
                console.error('Error:', error);
            });
        };

        // On page load: fetch the server's default config to prefill the form
        // (including the board size; rebuild the board if it differs).
        fetch('/config')
        .then(response => response.json())
        .then(cfg => {
            if (cfg.board_size && cfg.board_size !== boardSize) {
                boardSize = cfg.board_size;
                cellSize = canvas.width / boardSize;
                initBoard();
            }
            aiTypeSel.value = cfg.ai_type;
            modelInput.value = cfg.model || '';
            document.getElementById('simulate_times').value = cfg.simulate_times;
            document.getElementById('c_puct').value = cfg.c_puct;
            document.getElementById('cores').value = cfg.cores;
            document.getElementById('reuse_states').checked = cfg.reuse_states;
            document.getElementById('human_color').value = String(cfg.human_color);
            syncModelInput();
        })
        .catch(error => console.error('Error:', error));

        initBoard();
    </script>
</body>
</html>
